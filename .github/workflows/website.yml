name: Website

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 等当前上传完成，再发布主分支的下一个版本。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm docs:build
      - name: Check website output
        run: |
          test -s doc_build/index.html
          test -s doc_build/getting-started.html
          test -s doc_build/blog/index.html
          test -s doc_build/404.html
      - name: Save verified website
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: doc_build/
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: website-production
      url: ${{ env.WEBSITE_URL }}
    env:
      COS_BUCKET: semlo-editor-docs-1257461956
      COS_REGION: ap-guangzhou
      WEBSITE_URL: https://semlo-editor.0x219.com
    steps:
      - name: Check deployment revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # 重跑历史任务时，只发布仍是主分支最新提交的构建。
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main 已有更新的提交，本次构建跳过发布。"
          fi
      - name: Download verified website
        if: steps.revision.outputs.current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: website-dist
          path: dist
      - name: Install COSCLI
        if: steps.revision.outputs.current == 'true'
        shell: bash
        run: |
          # 校验与知几官网相同的 COSCLI 发布包。
          coscli="$RUNNER_TEMP/coscli"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$coscli" \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          printf '%s  %s\n' a07de5ba2800147a700ed29036b0c76a4229088cee68e1682d0eae19b638a915 "$coscli" | sha256sum --check
          chmod +x "$coscli"
      - name: Upload website to Tencent Cloud COS
        if: steps.revision.outputs.current == 'true'
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        shell: bash
        run: |
          : "${TENCENT_SECRET_ID:?请在 website-production 环境配置 TENCENT_SECRET_ID}"
          : "${TENCENT_SECRET_KEY:?请在 website-production 环境配置 TENCENT_SECRET_KEY}"
          test -s dist/index.html
          test -s dist/getting-started.html
          test -s dist/blog/index.html
          test -s dist/404.html

          umask 077
          config_dir="$(mktemp -d "$RUNNER_TEMP/cos.XXXXXXXX")"
          config="$config_dir/cos.yaml"
          trap 'rm -f -- "$config"; rmdir -- "$config_dir"' EXIT
          jq -n --arg bucket "$COS_BUCKET" --arg endpoint "cos.$COS_REGION.myqcloud.com" '{
            cos: {
              base: {
                secretid: env.TENCENT_SECRET_ID,
                secretkey: env.TENCENT_SECRET_KEY,
                disableencryption: "true",
                protocol: "https"
              },
              buckets: [{name: $bucket, alias: $bucket, endpoint: $endpoint}]
            }
          }' > "$config"
          unset TENCENT_SECRET_ID TENCENT_SECRET_KEY

          # 先上传静态资源，再更新 HTML，保留已有对象以供仍打开的页面使用。
          coscli=("$RUNNER_TEMP/coscli" --config-path "$config" --bucket-type COS)
          destination="cos://$COS_BUCKET/"
          "${coscli[@]}" cp ./dist/ "$destination" --recursive --skip-dir --exclude '\.(html|js|css)$'
          "${coscli[@]}" cp ./dist/ "$destination" --recursive --skip-dir --include '\.js$' \
            --meta 'Content-Type:text/javascript; charset=utf-8'
          "${coscli[@]}" cp ./dist/ "$destination" --recursive --skip-dir --include '\.css$' \
            --meta 'Content-Type:text/css; charset=utf-8'
          "${coscli[@]}" cp ./dist/ "$destination" --recursive --skip-dir --include '\.html$' \
            --meta 'Cache-Control:no-cache#Content-Type:text/html; charset=utf-8'
      - name: Verify public website
        if: steps.revision.outputs.current == 'true'
        shell: bash
        run: |
          # 核对根目录、无后缀文档和子目录，防止路由或旧缓存掩盖发布错误。
          verify_page() {
            local route="$1" local_file="$2"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --retry 3 --max-time 30 --header 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/website-page.html" "$WEBSITE_URL$route"
            if ! cmp -s "$RUNNER_TEMP/website-page.html" "$local_file"; then
              echo "::error::文档站 $route 返回的内容与本次构建不一致。"
              exit 1
            fi
          }
          verify_page / dist/index.html
          verify_page /getting-started dist/getting-started.html
          verify_page /blog/ dist/blog/index.html
