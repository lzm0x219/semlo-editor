name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: 收集浏览器测试耗时追踪
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-tests:
    name: 完整浏览器回归 (${{ matrix.shard }}/16)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:916c9fb63a8340822589dd5c821dae82e8012106bb8515a72f278d97f277446a
      options: --ipc=host
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [15]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build:browser-test
      - name: 运行浏览器回归
        env:
          PROFILE: ${{ inputs.profile }}
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: 16
        run: mise exec -- node scripts/ci-browser-shard.ts "$SHARD" "$SHARD_TOTAL"
      - name: 保存耗时追踪
        if: ${{ always() && inputs.profile }}
        uses: actions/upload-artifact@v7
        with:
          name: rstest-trace-${{ matrix.shard }}
          path: .rstest/trace-*
          if-no-files-found: warn

  cross-browser-smoke:
    name: Firefox 与 WebKit 烟雾检查
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:916c9fb63a8340822589dd5c821dae82e8012106bb8515a72f278d97f277446a
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build
      - run: mise exec -- node tests/browser/cross-browser/smoke.ts
