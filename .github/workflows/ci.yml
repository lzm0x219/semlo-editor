name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  docs-motion-probe:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:916c9fb63a8340822589dd5c821dae82e8012106bb8515a72f278d97f277446a
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build:browser-test
      - name: 对照文档首页测试
        shell: bash
        run: |
          set -eo pipefail
          for mode in normal reduce reduce normal normal reduce; do
            echo "::group::$mode"
            SEMLO_DOCS_PROBE_MODE="$mode" mise exec -- pnpm test:run --pool.maxWorkers 3 '"tests/docs/docs-home-mobile.test.ts"'
            echo "::endgroup::"
          done
      - name: 输出阶段耗时
        if: always()
        run: cat /tmp/semlo-docs-motion-probe.ndjson
