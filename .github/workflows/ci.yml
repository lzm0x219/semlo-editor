name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: 收集浏览器测试耗时追踪
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fixture-benchmark:
    name: Chromium ${{ matrix.page }} · ${{ matrix.sample }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:916c9fb63a8340822589dd5c821dae82e8012106bb8515a72f278d97f277446a
      options: --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        page: [demo, fixture]
        sample: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build:browser-test
      - name: 运行夹具样本
        env:
          SEMLO_BENCH_PAGE: ${{ matrix.page }}
        run: |
          mise exec -- pnpm test:run --pool.maxWorkers 3 \
            '"tests/features/table/table-keyboard-navigation.test.ts"' \
            '"tests/features/table/table-keyboard-code-navigation.test.ts"' \
            '"tests/adapters/embed-bookmark-framework.test.ts"' \
            '"tests/features/references/embed-bookmark-isolated.test.ts"'
