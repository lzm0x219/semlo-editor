name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: 收集浏览器测试耗时追踪
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: 类型、规范与构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build
      - run: mise exec -- pnpm typecheck
      - run: mise exec -- pnpm lint
      - run: mise exec -- pnpm format:check
      - run: mise exec -- pnpm build:demo
      - run: mise exec -- pnpm docs:build

  browser-tests:
    name: 完整浏览器回归 (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm exec playwright install --with-deps chromium
      - run: mise exec -- pnpm build:browser-test
      - name: 运行浏览器回归
        env:
          PROFILE: ${{ inputs.profile }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$PROFILE" = "true" ]; then
            mise exec -- pnpm test:run --shard "$SHARD/4" --pool.maxWorkers 2 --trace
          else
            mise exec -- pnpm test:run --shard "$SHARD/4" --pool.maxWorkers 2
          fi
      - name: 保存耗时追踪
        if: ${{ always() && inputs.profile }}
        uses: actions/upload-artifact@v4
        with:
          name: rstest-trace-${{ matrix.shard }}
          path: .rstest/trace-*
          if-no-files-found: warn

  cross-browser-smoke:
    name: Firefox 与 WebKit 烟雾检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build
      - run: mise exec -- pnpm exec playwright install --with-deps firefox webkit
      - run: mise exec -- node tests/browser/cross-browser/smoke.ts
