name: 标题删除 Chromium 耗时对照
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:916c9fb63a8340822589dd5c821dae82e8012106bb8515a72f278d97f277446a
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build:browser-test
      - name: 三轮交错对照
        shell: bash
        run: |
          original=('"tests/features/heading/heading-delete-controlled.test.ts"')
          split=('"tests/features/heading/heading-delete-controlled-react.test.ts"' '"tests/features/heading/heading-delete-controlled-vue.test.ts"' '"tests/features/heading/heading-delete-controlled-solid.test.ts"')
          for mode in original split split original original split; do
            echo "::group::$mode"
            if [ "$mode" = original ]; then
              files=("${original[@]}")
            else
              files=("${split[@]}")
            fi
            HEADING_PROBE_MODE="$mode" mise exec -- pnpm test:run "${files[@]}" --pool.maxWorkers 3
            echo "::endgroup::"
          done
